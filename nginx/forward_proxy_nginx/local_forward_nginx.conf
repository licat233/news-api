# 本项目的正向代理配置

# 使用前，需修改相关路径，如ssl证书路径，以及日志路径

# 公网 nginx 的配置
# client_max_body_size 100m; # 限制上传文件的大小

# 内网 nginx 映射的 http 端口
upstream news_internal_nginx_http_servers {
    server 127.0.0.1:50000 max_fails=3 fail_timeout=3s weight=10;
}

# web服务
server {
    listen 80;
    listen 443 ssl;
    listen [::]:443 ssl;
    # 启用HTTP/2协议
    http2 on;
    # 严格匹配
    server_name api.news01.cc;

    location / {
        proxy_set_header Host $host; #设置真实客户端地址，默认值是 $proxy_host;
        proxy_pass http://news_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址;
    }
    access_log /Users/licat/nginx/logs/api.news01.log;
    error_log /Users/licat/nginx/logs/api.news01.error.log;
}

# 拓展的服务
server {
    listen 80;
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on; # 启用HTTP/2协议
    # 严格匹配
    server_name ~^(mysql|redis)?\.news01.cc$;
    # server_name *.news01.cc;
    location / {
        proxy_set_header Host $host; #设置真实客户端地址，默认值是 $proxy_host;
        proxy_pass http://news_internal_nginx_http_servers; # 真实服务器的地址，可以是ip也可以是域名和url地址;
    }
    access_log /Users/licat/nginx/logs/multi.news01.cc.log;
    error_log /Users/licat/nginx/logs/multi.news01.cc.error.log;
}
